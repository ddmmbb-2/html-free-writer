<!doctype html>
<html lang="zh-Hant" data-mode="read"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未命名文件</title>
<style>
:root{color-scheme:light;--ink:#20282a;--muted:#526063;--line:#dde3e2;--panel:#fff;--work:#e9eeec;--accent:#215d54;--accent-light:#e7f2ee;--guide:#007e9d;--danger:#c83e3b;--danger-light:#fdf0ef;--danger-line:#e4a3a1;font:14px/1.5 "Inter","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color:var(--ink)}
*{box-sizing:border-box}
body{margin:0}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
button,input,select{min-height:34px;border:1px solid var(--line);border-radius:6px;background:white;padding:5px 9px}
button:hover,select:hover{background:#f1f5f3}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #268172;outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent-light);border-color:#8bb9af;color:var(--accent)}
.primary,.primary:hover{color:white;background:var(--accent);border-color:var(--accent)}
.danger-action{color:var(--danger);background:var(--danger-light);border-color:var(--danger-line);font-weight:600}
.danger-action:hover{background:#fae0de;border-color:var(--danger)}
[hidden]{display:none!important}
#editor{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.chrome{flex:none;background:var(--panel);z-index:2}
.top,.toolbar,.group,.side-title,.page-nav,.grid-option,.statusbar{display:flex;align-items:center;gap:6px}
.top,.toolbar{padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top{justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{display:grid;place-items:center;width:30px;height:34px;border-radius:6px;background:var(--accent);color:white;font-weight:750}
.brand strong{display:block;font-size:12px}
#document-title{background:transparent;border-color:transparent;border-radius:4px;min-height:23px;padding:1px 2px;font-weight:650;width:clamp(120px,23vw,280px)}
#document-title:not(:read-only):hover{border-color:var(--line)}
.group{flex-wrap:wrap}
.toolbar .group+.group{border-inline-start:1px solid var(--line);padding-inline-start:7px}
.zoom-value{min-width:58px;font-variant-numeric:tabular-nums}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:164px minmax(0,1fr) 204px}
.sidebar{background:var(--panel);padding:13px 10px;overflow:auto}
.pages{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
.side-title{justify-content:space-between;margin:0 0 8px}
.side-title h2{font-size:13px;margin:0}
.side-title button{min-height:28px}
.page-list,.object-list{display:grid;gap:4px}
.page-list button,.object-list button{text-align:left;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-section{margin-top:17px}
.work{overflow:auto;background:var(--work);padding:22px 24px 54px;overscroll-behavior:contain}
.stage{position:relative;margin-inline:auto;overflow:clip;overflow-clip-margin:18px}
.read-pages{display:none;flex-direction:column;gap:22px}
.read-stage{flex:none}
.page{position:absolute;inset:0 auto auto 0;width:210mm;height:297mm;background:white;transform-origin:top left;box-shadow:0 0 0 1px #52696141,0 10px 32px #21362e1c;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.grid-layer{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,#628f8824 1px,transparent 1px),linear-gradient(to bottom,#628f8824 1px,transparent 1px);background-size:var(--grid-step,5mm) var(--grid-step,5mm)}
.margin-layer{position:absolute;inset:15mm;border:1px dashed #789d95a0;pointer-events:none}
.guide-x,.guide-y{position:absolute;pointer-events:none;z-index:3;background:var(--guide)}
.guide-x{top:0;bottom:0;width:1px}
.guide-y{left:0;right:0;height:1px}
.item{position:absolute;touch-action:none;cursor:move;user-select:none}
.item:focus{outline:none}
.item[data-selected]{outline:1.5px solid #177c6e}
.item[data-overflow]{outline:1.5px dashed var(--danger)}
.item[data-selected][data-overflow]{outline:1.5px solid var(--danger)}
.overflow-line{display:none;position:absolute;left:0;right:0;border-top:1.5px dashed var(--danger);pointer-events:none;z-index:2}
.overflow-line::after{content:attr(data-label);position:absolute;right:0;top:2px;padding:1px 5px;border-radius:3px;background:var(--danger);color:white;font:600 10px/1.3 "Inter","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;white-space:nowrap}
.item[data-overflow] .overflow-line{display:block}
.object-list button[data-overflow]{color:var(--danger);border-color:var(--danger-line)}
#overflow-tools button{width:100%}
.item:focus-visible{outline:2px solid #177c6e}
.item-body{min-height:100%;width:100%;font:12pt/1.55 "Microsoft JhengHei","Noto Sans CJK TC","PingFang TC",system-ui,sans-serif;overflow-wrap:anywhere;color:#1f2d2b}
.item-body:focus{outline:none}
.item-body p,.item-body ul,.item-body ol{margin:0 0 .55em}
/* Compact paragraph styles: attributes are persisted in the document HTML. */
.item-body [data-body-size="small"]{font-size:10pt;line-height:1.3;margin-block:0 .3em}
.item-body [data-body-size="tiny"]{font-size:8pt;line-height:1.15;margin-block:0 .15em}
.item-body h1,.item-body h2,.item-body h3{line-height:1.25;margin:0 0 .35em}
.item-body h1{font-size:24pt}.item-body h2{font-size:17pt}.item-body h3{font-size:14pt}
.item-body table{width:100%;table-layout:fixed;border-collapse:collapse}
.item-body th,.item-body td{border:1px solid #b9c9c5;text-align:left;padding:5px 7px;vertical-align:top}
.item-body th{background:#edf4f0}
.item-body img{max-width:100%;height:auto;vertical-align:middle}
.item[data-kind="image"] .item-body img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
.item[data-kind="image"] .item-body{height:100%}
.item[data-kind="symbol"] .item-body{height:100%}
.item[data-kind="symbol"] svg{display:block;width:100%;height:100%;pointer-events:none}
.item[data-editing]{cursor:text;touch-action:auto;user-select:text}
.item[data-picking-cells]{touch-action:none;user-select:none}
.item[data-picking-cells] :is(td,th){cursor:cell}
.item [data-cell-picked]{background:#dcefed;box-shadow:inset 0 0 0 2px #297c72}
.resize,.rotate-item{display:none;position:absolute;min-height:0;padding:0;border:1.5px solid #177c6e;background:white;z-index:1;touch-action:none}
.resize{right:0;bottom:0;transform:translate(50%,50%);width:14px;height:14px;border-radius:2px;cursor:nwse-resize}
.rotate-item{left:50%;bottom:calc(100% + 13px);transform:translateX(-50%);width:26px;height:26px;color:#177c6e;border-radius:50%;font-size:17px;line-height:1;cursor:grab}
.rotate-item::after{content:"";position:absolute;top:100%;left:50%;height:14px;border-left:1px solid #177c6e;pointer-events:none}
.rotate-item:active{cursor:grabbing}
.item[data-selected] :is(.resize,.rotate-item){display:block}
.item[data-editing] .resize{display:none}
.measurements{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.measurements label{display:grid;gap:3px;color:var(--muted);font-size:12px}
.measurements input{width:100%;min-width:0;font-variant-numeric:tabular-nums}
.transform-options{margin-top:9px;align-items:end}
.transform-options .aspect-lock{display:flex;align-self:center;flex-wrap:wrap;gap:4px}
.transform-options .aspect-lock input{width:auto;min-height:0;margin:0;accent-color:var(--accent)}
.inspector-actions,.grid-option{margin-top:9px;flex-wrap:wrap}
.table-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.table-actions button{font-size:12px;padding-inline:4px}
.table-actions .full-width{grid-column:1/-1}
.symbol-color,.text-color{display:inline-flex;align-items:center;gap:7px}
.palette-wrap{position:relative;display:inline-flex;align-items:center;gap:5px;max-width:100%}
.palette-toggle{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.palette-current{width:17px;height:17px;border:1px solid #0004;border-radius:3px;display:inline-block;flex:none}
.palette-panel{position:fixed;z-index:20;padding:9px;background:white;border:1px solid var(--line);box-shadow:0 7px 24px #182b2533;border-radius:8px;width:max-content;max-width:calc(100vw - 12px)}
.palette-grid{display:grid;grid-template-columns:repeat(10, minmax(0,1fr));gap:4px}
.palette-grid button{width:23px;height:23px;min-height:0;padding:0;border:1px solid #0003;border-radius:3px;background:var(--swatch)}
.palette-grid button:hover,.palette-grid button:focus-visible{background:var(--swatch);outline:2px solid var(--accent);outline-offset:1px}
.palette-grid button[aria-pressed="true"]{background:var(--swatch);border:2px solid white;box-shadow:0 0 0 2px var(--accent)}
.attachment-card{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:6px 9px;border:1px solid #b9c9c5;border-radius:5px;background:#f3f7f5;height:100%;overflow:hidden;font-size:10pt;line-height:1.25}
.item[data-kind="attachment"] .item-body{height:100%}
.attachment-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.attachment-meta{font-size:8pt;color:#526063}
.attachment-actions{display:flex;gap:4px;flex-wrap:wrap}
.attachment-actions button{font-size:9pt;min-height:0;padding:2px 6px;line-height:1.3}
@media print{.attachment-actions{display:none!important}}
@media(max-width:350px){.palette-grid button{width:19px;height:19px}}
.grid-option label{display:inline-flex;gap:4px;align-items:center}
.grid-option input{min-height:0;margin:0;accent-color:var(--accent)}
.grid-option select{min-height:29px}
.statusbar{justify-content:space-between;background:white;border-top:1px solid var(--line);padding:4px 12px;min-height:26px;flex:none;color:var(--muted);font-size:12px}
.statusbar span{text-align:right}
.read-only{display:none}
[data-mode="read"] .edit-only{display:none!important}
[data-mode="read"] .read-only{display:initial}
[data-mode="read"] .shell{grid-template-columns:164px minmax(0,1fr)}
[data-mode="read"] #stage{display:none}
[data-mode="read"] .read-pages{display:flex}
[data-mode="read"] .page{overflow:hidden}
[data-mode="read"] .item{cursor:auto;touch-action:auto;user-select:text}
#print-root{display:none}
@media(max-width:880px){
  .shell{grid-template-columns:124px minmax(0,1fr) 170px}
  [data-mode="read"] .shell{grid-template-columns:124px minmax(0,1fr)}
  .work{padding-inline:14px}
}
@media(max-width:680px){
  .shell,[data-mode="read"] .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .pages{border-right:0;border-bottom:1px solid var(--line);padding:5px 7px;display:flex;gap:6px;align-items:start}
  .pages .side-title{margin:0;white-space:nowrap}
  .page-list{display:flex;overflow:auto}
  .page-list button{width:auto;flex:none;min-height:28px}
  .inspector{border-left:0;border-top:1px solid var(--line);max-height:26dvh;padding:5px 7px}
  .measurements{grid-template-columns:repeat(4,minmax(0,1fr))}
  .inspector .side-section{margin-top:7px}
  .object-list{display:flex;overflow:auto}
  .object-list button{width:auto;flex:none;max-width:155px}
  .top,.toolbar{padding:5px 7px}
  .work{padding:12px 9px 42px}
  .read-pages{gap:14px}
  .top .group,.toolbar,.toolbar .group{gap:4px}
  .top button,.toolbar button,.toolbar select{min-height:29px;padding:3px 6px}
}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:white;margin:0;padding:0}
  body{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  #editor{display:none}
  #print-root{display:block}
  .print-page{position:relative;width:210mm;height:296.9mm;overflow:hidden;break-inside:avoid;break-after:page}
  .print-page:last-child{break-after:auto}
}
</style>
</head>
<body>
<main id="editor">
  <header class="chrome">
    <div class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">文</span>
        <div><strong>自由排版 Word</strong><input id="document-title" aria-label="文件名稱" maxlength="100"></div>
      </div>

        <button id="new-file" class="edit-only" type="button">新文件</button>

        <button id="save" type="button" class="primary">另存 HTML</button>

    </div>
    <div class="toolbar">

        <button id="undo" type="button" title="復原 Ctrl+Z" aria-label="復原">↶</button>
        <button id="redo" type="button" title="重做 Ctrl+Y" aria-label="重做">↷</button>
      </div>
      <div class="group" role="group" aria-label="頁面縮放">
        <button id="zoom-out" type="button" title="縮小" aria-label="縮小">−</button>
        <button id="zoom-reset" class="zoom-value" type="button" title="還原 100%">100%</button>

        <select id="format" aria-label="段落樣式">

        <button type="button" data-command="bold" aria-label="粗體"><b>B</b></button>
        <button type="button" data-command="italic" aria-label="斜體"><i>I</i></button>
        <button type="button" data-command="underline" aria-label="底線"><u>U</u></button>

  </header>
  <div class="shell">

        <div id="object-list" class="object-list"></div>

  </div>

  const option = el("option");
  option.value = key;
  option.textContent = shape.name;
  $("symbol-picker").append(option);
}
$("symbol-picker").addEventListener("change",event => {
  const key = event.target.value;
  const shape = symbols[key];
  if (shape && Object.hasOwn(symbols,key)) addObject("symbol",{shape:key,color:"#215d54",w:shape.w,h:shape.h});
  event.target.value = "";
});
$("attachment-file").addEventListener("change",event => {
  const files = Array.from(event.target.files); event.target.value = ""; addAttachments(files);
});
$("attachment-open").addEventListener("click",()=>accessAttachment(selected(),true));
$("attachment-download").addEventListener("click",()=>accessAttachment(selected(),false));
$("image-file").addEventListener("change",event => {
  loadImage(event.target.files[0]);
  event.target.value = "";
});
$("properties").addEventListener("change",event => {
  const key = event.target.dataset.geometry;
  if (key) changeGeometry(key,event.target.valueAsNumber);
});
$("lock-ratio").addEventListener("change",event => {
  const object = selected(), locked = event.target.checked;
  if (!object || !isGraphic(object) || fixedRatio(object) === locked) return;
  const before = capture();
  object.lockRatio = locked;
  record(before);
});
$("front").addEventListener("click",() => changeLayer(1));
$("back").addEventListener("click",() => changeLayer(-1));
$("delete-object").addEventListener("click",deleteObject);
$("move-overflow").addEventListener("click",moveOverflowToNextPage);
$("toolbar-move-overflow").addEventListener("click",moveOverflowToNextPage);
$("select-cells").addEventListener("click",tableEditor.toggle);
for (const action of ["add-row","add-column","remove-row","remove-column",
  "merge-horizontal","merge-vertical","merge-range","split-columns","split-rows"]) {
  $(action).addEventListener("click",() => tableEditor.change(action));
}
$("add-page").addEventListener("click",() => {
  finishEdit();
  const before = capture(), next = blank();
  model.pages.splice(model.pages.indexOf(currentPage()) + 1,0,next);
  record(before);
  nav(next.id);
});
$("delete-page").addEventListener("click",() => {
  if (model.pages.length < 2) return;
  if (currentPage().objects.length && !confirm("刪除此頁和頁面上的物件？")) return;
  finishEdit();
  const before = capture(), index = model.pages.indexOf(currentPage());
  model.pages.splice(index,1);
  record(before);
  nav(model.pages[Math.min(index,model.pages.length - 1)].id);
});
$("new-file").addEventListener("click",() => {
  if (!confirm("開始一份空白文件？")) return;
  finishEdit();
  const before = capture(), first = blank();
  model = {version:1,title:"未命名文件",pages:[first]};
  record(before);
  nav(first.id);
});
$("document-title").addEventListener("change",syncTitle);
$("mode").addEventListener("click",() => {
  finishEdit();
  clearScrollLock();
  root.dataset.mode = isReading() ? "edit" : "read";
  selectedId = null;
  render();
  if (fitWidth) fit();
  if (isReading()) scrollToPage(pageId,"auto");
  else work.scrollTo(0,0);
});
work.addEventListener("scroll",() => {
  if (!isReading() || scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    syncScrollPage();
  });
},{passive:true});
work.addEventListener("scrollend",clearScrollLock);
for (const name of ["wheel","touchstart","pointerdown"]) work.addEventListener(name,clearScrollLock,{passive:true});
$("show-grid").addEventListener("change",updateGuides);
$("grid-step").addEventListener("change",updateGuides);
$("zoom-out").addEventListener("click",() => zoom(-1));
$("zoom-in").addEventListener("click",() => zoom(1));
$("zoom-reset").addEventListener("click",() => { fitWidth = false; setScale(1); });
$("zoom-fit").addEventListener("click",() => { fitWidth = true; fit(); });
$("undo").addEventListener("click",() => stepHistory(undo,redo));
$("redo").addEventListener("click",() => stepHistory(redo,undo));
$("save").addEventListener("click",saveHTML);
$("print").addEventListener("click",() => { printPages(); window.print(); });
window.addEventListener("beforeprint",printPages);
window.addEventListener("afterprint",() => $("print-root").replaceChildren());
document.addEventListener("keydown",event => {
  if (drag) {
    if (event.key === "Escape") endDrag({pointerId:drag.pointer,type:"pointercancel"});
    return;
  }
  const command = event.ctrlKey || event.metaKey, key = event.key.toLowerCase();
  if (command && key === "s") { event.preventDefault(); saveHTML(); return; }
  if (isReading() || event.target.closest("input,textarea,select")) return;
  if (event.key === "Escape") {
    if (["text","symbol"].some(kind=>!$(kind+"-palette-panel").hidden)) {closePalettes();return;}
    if (editing) { const frame = frames.get(selectedId); finishEdit(); frame?.focus(); }
    else choose(null);
    return;
  }
  const history = command && (key === "z" || key === "y");
  if (editing && editing.body.contains(event.target)
      && (!history || editing.body.innerHTML !== selected()?.html)) return;
  if (history) {
    event.preventDefault();
    if (key === "y" || event.shiftKey) stepHistory(redo,undo);
    else stepHistory(undo,redo);
    return;
  }
  const frame = event.target.closest(".item");
  if (!frame || frame.dataset.id !== selectedId) return;
  if (event.key === "Enter") { event.preventDefault(); startEdit(selected()); }
  if (event.key === "Delete" || event.key === "Backspace") { event.preventDefault(); deleteObject(); }
  const movement = {ArrowLeft:["x",-1],ArrowRight:["x",1],ArrowUp:["y",-1],ArrowDown:["y",1]}[event.key];
  if (movement) {
    event.preventDefault();
    const [axis,direction] = movement;
    changeGeometry(axis,selected()[axis] + direction * (event.shiftKey ? 5 : 1));
  }
});
new ResizeObserver(() => { if (fitWidth) fit(); }).observe(work);
render();
setScale(1);
fit();
})();
</script></body></html>
